<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>F1 title forecast</title>
<style>
  body{font-family:system-ui,sans-serif;max-width:720px;margin:40px auto;padding:0 16px;color:#1F2933}
  h1{margin-bottom:4px}.muted{color:#52606D}
  .card{background:#F3F5F7;border-radius:10px;padding:16px;margin:16px 0;font-size:1.1rem}
  table{border-collapse:collapse;width:100%}td,th{padding:6px 8px;border-bottom:1px solid #E6E9ED;text-align:left}
</style>
</head>
<body>
<h1>F1 title forecast</h1>
<p class="muted" id="status">Loading...</p>
<div id="out"></div>
<script>
const name = id => id.split("_").pop().replace(/^./, c => c.toUpperCase());
const pct = x => (100 * x).toFixed(1) + "%";
function el(tag, text, parent) { const e = document.createElement(tag); if (text) e.textContent = text; parent.appendChild(e); return e; }

fetch("data/latest.json")
  .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(s => {
    document.getElementById("status").textContent =
      "After round " + s.after_round + (s.race.name ? " (" + s.race.name + ")" : "") +
      " | updated " + s.generated_at;
    const out = document.getElementById("out");
    const card = el("div", "", out); card.className = "card";
    el("div", name(s.leader) + " champion: " + pct(s.p_leader) + " | comeback: " + pct(s.p_comeback), card);
    if (s.clinch.length) {
      const best = s.clinch.reduce((a, b) => (b.decided_here > a.decided_here ? b : a));
      el("div", "Most likely decided at round " + best.round + (best.name ? " (" + best.name + ")" : "") +
         " | " + pct(best.decided_here), card);
    }
    const t = el("table", "", out);
    const head = el("tr", "", t);
    ["Round", "Race", "Decided here", "Decided by"].forEach(h => el("th", h, head));
    s.clinch.forEach(c => {
      const row = el("tr", "", t);
      [c.round, c.name || "", pct(c.decided_here), pct(c.decided_by)].forEach(v => el("td", String(v), row));
    });
    el("p", "Probabilities, not certainties. Rating-based Monte Carlo; method and backtest in the repository README.", out)
      .className = "muted";
  })
  .catch(() => { document.getElementById("status").textContent = "No forecast published yet."; });
</script>
</body>
</html>
